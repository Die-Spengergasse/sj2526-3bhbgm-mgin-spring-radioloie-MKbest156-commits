<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <title>Patientenliste</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
</head>
<body>
<div class="container" style="margin-top: 30px;">
    <h1>Patientenliste</h1>
    <p>
        <a href="/">Start</a> |
        <a href="/patient/add">Neuer Patient</a> |
        <a href="/reservation/add">Reservierung erfassen</a> |
        <a href="/reservation/list">Reservierungsliste</a>
    </p>
    <table class="table">
        <thead>
            <tr>
                <th>SVNR</th>
                <th>Vorname</th>
                <th>Nachname</th>
                <th>Geschlecht</th>
                <th>Geburtsdatum</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="p : ${patients}">
                <td th:text="${p.socialInsuranceNumber}"></td>
                <td th:text="${p.firstName}"></td>
                <td th:text="${p.lastName}"></td>
                <td th:text="${p.gender}"></td>
                <td th:text="${p.birthDate}"></td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
